name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check syntax
        run: python -m compileall src tests

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check QML
        shell: pwsh
        run: |
          Get-ChildItem src/music_bio/gui/qml/*.qml |
            ForEach-Object {
              pyside6-qmllint --unqualified disable --max-warnings 0 $_.FullName
            }

      - name: Check browser extension
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/content.js
          node --check browser-extension/options.js
          node --check browser-extension/page-player.js
          node browser-extension/tests/content.test.cjs
          node browser-extension/tests/options.test.cjs
          node browser-extension/tests/page-player.test.cjs

      - name: Test
        run: pytest
